name: Link check

on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 20
            --exclude-mail --accept 200,206,429
            "**/*.md"
          fail: true
      - name: Open an issue on failure (scheduled runs only)
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links found by weekly link-check"
          content-filepath: ./lychee/out.md
          labels: outdated, automated

name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "good first issue,pinned,roadmap,help wanted"
          exempt-pr-labels: "pinned,work in progress"
          stale-issue-message: >
            This has been quiet for 45 days. It'll close in 14 days unless there's
            new activity. Not stale? Just comment.
          stale-pr-message: >
            This PR has been quiet for 45 days. It'll close in 14 days unless updated.
            Ping a maintainer if you're blocked on review.
